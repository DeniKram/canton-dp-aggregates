[project]
name = "canton-dp-aggregates"
version = "0.1.0"
description = "Differentially private market aggregates for Canton Network: attacks, mechanisms, experiments"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Denis Kramskyi" }]
dependencies = ["numpy>=1.26", "pandas>=2.0", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
